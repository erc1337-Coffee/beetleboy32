; BeetleBoy32. One codebase, two targets (`./run` wraps the commands):
;   sim       -> the app in a macOS window (SDL2), talking to the real site
;   waveshare -> the Waveshare ESP32-S3-Touch-LCD-1.69 (ST7789V2 + CST816T)
; Shared code lives in src/; per-target code in src/platform/<esp32|sim>/.
; Pin numbers live in include/board_config.h.

[platformio]
default_envs = sim

[env]
extra_scripts =
    pre:scripts/cxx17.py
    pre:scripts/assets.py
    pre:scripts/project_info.py

[common]
build_flags =
    -I include
    -DLV_CONF_INCLUDE_SIMPLE
lvgl = lvgl/lvgl@9.2.2
libs =
    ${common.lvgl}
    bblanchon/ArduinoJson@7.2.1
    libwebp

[env:sim]
platform = native
lib_deps = ${common.libs}
build_src_filter = +<*> -<platform/esp32/>
build_flags =
    ${common.build_flags}
    !sdl2-config --cflags --libs
    -lcurl

[esp32]
platform = espressif32@6.9.0
framework = arduino
board = esp32-s3-devkitc-1
monitor_speed = 115200
lib_deps =
    ${common.libs}
    lovyan03/LovyanGFX@^1.2.7
build_src_filter = +<*> -<platform/sim/>
build_unflags = -std=gnu++11

[env:waveshare]
extends = esp32
; ESP32-S3R8: 16 MB flash, 8 MB octal PSRAM. USB-C goes to native USB, so route Serial over USB CDC.
board_upload.flash_size = 16MB
board_build.partitions = default_16MB.csv
board_build.arduino.memory_type = qio_opi
build_flags =
    ${common.build_flags}
    -DBOARD_HAS_PSRAM
    -DARDUINO_USB_MODE=1
    -DARDUINO_USB_CDC_ON_BOOT=1
